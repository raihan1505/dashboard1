<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Pipeline</title>
<style>
  :root{--won:#76b7b2;--hot:#f28e2b;--pot:#e15759;--fc:#4e79a7;--ink:#333;--muted:#6f7b8a;--grid:#e3e6ea;--sel:#dde6f0}
  *{box-sizing:border-box}
  body{margin:0;background:#f3f4f6;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);padding:16px}
  .wrap{max-width:1000px;margin:0 auto}
  .tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:1}
  .tabs button{font:inherit;font-size:13px;padding:7px 16px;border:1px solid #d9dce0;border-bottom:0;background:#e8eaed;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600}
  .tabs button:focus-visible{outline:2px solid #4e79a7}
  .dash{display:flex;gap:14px;background:#fff;padding:12px;border:1px solid #d9dce0}
  .dash[hidden]{display:none}
  .chart{flex:1;min-width:0;border:1px solid #cfd3d8;padding:6px 8px 8px}
  h1{font-size:24px;font-weight:600;margin:4px 0 10px;letter-spacing:.2px}
  .head{display:grid;grid-template-columns:150px 1fr;font-size:14px;font-weight:600;border-bottom:1px solid var(--grid);padding-bottom:4px}
  .head span:last-child{text-align:center;padding-right:8px}
  .row{display:grid;grid-template-columns:110px 26px 1fr;height:96px;border-bottom:1px solid var(--grid)}
  .who{font-size:13px;color:var(--muted);align-self:center;line-height:1.35;word-break:break-word;padding-right:6px}
  .yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;text-align:center;align-self:center}
  .plot{position:relative;margin:10px 0 9px 34px}
  .tick{position:absolute;left:-34px;width:28px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(50%)}
  .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
  .bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
  .col{position:relative;transition:opacity .2s}
  .bar{position:absolute;left:14%;right:14%;bottom:0;transition:height .35s;cursor:pointer;min-height:2px}
  .val{position:absolute;left:-10%;right:-10%;text-align:center;font-size:12.5px;white-space:nowrap;pointer-events:none}
  .foot{display:grid;grid-template-columns:136px 1fr;font-size:13px;color:var(--muted);padding-top:6px}
  .foot div{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-left:34px}
  .empty{padding:60px 10px;text-align:center;color:var(--muted);font-size:14px}
  /* DASHOARD PT */
  .head2{grid-template-columns:190px 1fr}
  .r2{display:grid;grid-template-columns:190px repeat(4,1fr);height:24px;border-bottom:1px solid var(--grid);align-items:end}
  .r2 .who{align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;line-height:1;word-break:normal}
  .cell{position:relative;height:100%;border-left:1px solid transparent}
  .cell .h{position:absolute;left:12%;right:12%;bottom:2px;cursor:pointer}
  .cell .t{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11.5px;line-height:13px;white-space:nowrap;pointer-events:none}
  .foot2{display:grid;grid-template-columns:190px repeat(4,1fr);font-size:13px;color:var(--muted);padding-top:6px;text-align:center}
  /* sidebar */
  aside{width:190px;flex:none;font-size:13px}
  aside h3{font-size:13px;font-weight:600;margin:0 0 6px}
  .sec{margin-bottom:20px}
  .list{max-height:560px;overflow:auto}
  .list.short{max-height:none}
  label.o{display:flex;align-items:center;gap:6px;padding:2px 3px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden}
  label.o.on{background:var(--sel)}
  label.o span{overflow:hidden;text-overflow:ellipsis}
  input[type=checkbox]{margin:0;accent-color:#4e79a7;flex:none}
  .rng{position:relative;height:22px;margin-top:4px}
  .rng input{position:absolute;left:0;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;margin:0;height:22px}
  .rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid #555;cursor:pointer}
  .rng input::-moz-range-thumb{pointer-events:auto;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #555;cursor:pointer}
  .track{position:absolute;left:0;right:0;top:10px;height:2px;background:#bbb}
  .fill{position:absolute;top:10px;height:2px;background:#4e79a7}
  .rv{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .lg{display:flex;align-items:center;gap:6px;padding:2px 3px;cursor:pointer;color:var(--muted);border:0;background:none;width:100%;font:inherit;text-align:left}
  .lg i{width:11px;height:11px;display:inline-block}
  .lg.sel{background:var(--sel);color:var(--ink)}
  .lg:focus-visible,label.o:focus-within{outline:2px solid #4e79a7}
  .grad{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .grad i{flex:1;height:18px;background:linear-gradient(90deg,#d3e5f4,#2a5b8c)}
  #tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #bbb;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:6px 9px;font-size:12px;display:none;z-index:9;line-height:1.5}
  @media(max-width:760px){.dash{flex-direction:column}aside{width:100%}.row{grid-template-columns:80px 22px 1fr}.head,.foot{grid-template-columns:110px 1fr}.val{font-size:10px}
    .r2,.foot2{grid-template-columns:110px repeat(4,1fr)}.head2{grid-template-columns:110px 1fr}.cell .t{font-size:9px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab1" aria-selected="true">SALES PIPELINE</button>
    <button role="tab" id="tab2" aria-selected="false">DASHBOARD PT</button>
  </div>
  <section class="dash" id="d1">
    <div class="chart"><h1>SALES PIPELINE</h1>
      <div class="head"><span>Owner</span><span>Staging Category</span></div>
      <div id="rows1"></div><div class="foot"><span></span><div id="cats1"></div></div></div>
    <aside id="side1"></aside>
  </section>
  <section class="dash" id="d2" hidden>
    <div class="chart"><h1>PT</h1>
      <div class="head head2"><span>Sold To Party</span><span>Staging Category</span></div>
      <div id="rows2"></div><div class="foot2"><span></span><span id="c2a"></span><span id="c2b"></span><span id="c2c"></span><span id="c2d"></span></div></div>
    <aside id="side2"></aside>
  </section>
</div>
<div id="tip"></div>
<script>
const D1={"cats": ["Won", "Hot Prospect", "Potential", "Forecast"], "rows": [["ABDURAHMAN HARITS #", [1286962565.0, 8185565712.0, 4489678773.0, 16066591960.0]], ["ELVAN PRATAMA", [5372249277.64, 68567420258.33, 20135524706.6, 20622924084.6]], ["HENDRA NURJAYA AL-KHOLIS #", [2090654878.0, 10515617942.0, 5840405517.0, 18862921253.0]], ["KHULAIFI ALKATSIRI #", [1458439069.0, 13068443017.0, 2597634578.0, 14398006810.0]], ["MUHAMMAD THAREQ RENALDI", [6025547360.0, 9018708725.0, 20634185654.0, 33328472050.0]], ["NAUFAL AMIR #", [4368078212.8, 13960714724.44, 11785848641.0, 35436900961.0]], ["ZEIN DIO ARRYADITHA", [335143374.0, 8364950078.0, 6443131064.0, 18330359661.0]]]}, D2={"cats": ["Forecast", "Hot Prospect", "Potential", "Won"], "rows": [["BUMA BINUNGAN", [null, null, 1200000000.0, null]], ["BUMA IPR", [null, 2.0, null, null]], ["PRATAMA NUSA SENTOSA", [540000000.0, null, null, null]], ["PT ANTAREJA MAHADA MAKMUR", [1293456200.0, 951354759.0, null, null]], ["PT ARTHA TUNGGAL MANDIRI", [null, 2618946.0, null, 8294375.0]], ["PT ASET SOLUSI TERBARUKAN", [null, 0.0, null, null]], ["PT BAYAN RESOURCES TBK.", [null, 69790000.0, null, null]], ["PT BIMA NUSA INTERNASIONAL", [null, 17000000.0, null, 18000000.0]], ["PT BINA PERTIWI", [2222050000.0, 4020000.0, null, null]], ["PT BUKIT MAKMUR MANDIRI UTAMA", [19043057921.0, 15528195902.0, 6929245764.0, 2251645649.0]], ["PT CAKRA PERKASA JAYAMULIA", [null, null, null, 2373740.0]], ["PT INDO MURO KENCANA", [null, null, null, 45000000.0]], ["PT INDONESIA PRATAMA", [null, 439949000.0, 19776250.0, null]], ["PT KALIMANTAN CITRA BARA", [null, 703800900.0, null, null]], ["PT KALIMANTAN PRIMA PERSADA", [1152000000.0, 683274624.0, 780495951.0, 6029346.0]], ["PT KARUNIA ARMADA INDONESIA", [2705708395.0, null, 1821434586.0, null]], ["PT KUMALA BAHTERA UTAMA", [1354500000.0, null, 348000000.0, null]], ["PT MADHANI TALATAH NUSANTARA", [66000000.0, 867772153.07, 195000000.0, 13648160.0]], ["PT MANDALA KARYA PRIMA", [3501350000.0, 1103290579.0, 114750000.0, 303105836.0]], ["PT MANDIRI HERINDO ADIPERKASA TBK", [0.0, 1325754600.0, 55162500.0, null]], ["PT MUTIARA TANJUNG LESTARI", [6740033301.0, 11278958432.0, 4306459480.0, 380408581.0]], ["PT Nusatama Berkah Tbk", [null, null, 34213089.0, null]], ["PT PAMAPERSADA NUSANTARA", [29993162833.6, 47555366342.7, 15314465353.6, 5512292325.44]], ["PT PETROSEA TBK", [null, 146000000.0, null, 7427000.0]], ["PT PRIMA SARANA GEMILANG", [null, 56000000.0, null, null]], ["PT PUTRA PERKASA ABADI", [8678397000.0, 1996946479.0, 2984409553.0, 2065195487.0]], ["PT SAPTAINDRA SEJATI", [25766431050.0, 9236043317.0, 23933703776.0, 5172942693.0]], ["PT SIMS JAYA KALTIM", [380100000.0, 407980000.0, 403400000.0, null]], ["PT TRINITY AUTO", [null, 0.0, null, 13653211.0]], ["PT. PELSART TAMBANG KENCANA", [null, 140000000.0, 380000000.0, null]], ["THIESS CONTRACTORS INDONESIA", [null, null, null, 1742096.0]], ["UNITED TRACTORS TBK", [53381552379.0, 38847100921.0, 12980493031.0, 5135316237.0]]]};
const COL=["--won","--hot","--pot","--fc"];
const fmt=n=>Math.round(n).toLocaleString("id-ID");
const $=id=>document.getElementById(id), tip=$("tip");
const showTip=(el,html)=>{el.onmousemove=e=>{tip.style.display="block";tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+14+"px";tip.innerHTML=html};el.onmouseleave=()=>tip.style.display="none"};

// ---- komponen filter bersama ----
function checklist(host,title,names,set,cb,short){
  const box=document.createElement("div");box.className="sec";host.appendChild(box);
  function draw(){
    const n=set.size,t=names.length;
    box.innerHTML=`<h3>${title}</h3><div class="list ${short?"short":""}"><label class="o"><input type="checkbox" id="${host.id}all" ${n===t?"checked":""}><span>(All)</span></label>`+
      names.map((o,i)=>`<label class="o ${set.has(o)?"on":""}" title="${o}"><input type="checkbox" data-i="${i}" ${set.has(o)?"checked":""}><span>${o}</span></label>`).join("")+"</div>";
    const all=box.querySelector("#"+host.id+"all");all.indeterminate=n>0&&n<t;
    all.onchange=e=>{(e.target.checked?names:[]).length?names.forEach(x=>set.add(x)):set.clear();draw();cb()};
    box.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{const keep=box.querySelector(".list").scrollTop,o=names[c.dataset.i];c.checked?set.add(o):set.delete(o);draw();box.querySelector(".list").scrollTop=keep;cb()});
  }
  draw();
}
function range(host,min,max,st,cb){
  min=Math.floor(min);max=Math.ceil(max);
  const box=document.createElement("div");box.className="sec";
  box.innerHTML=`<h3>Est Revenue</h3><div class="rv"><span class="lo"></span><span class="hi"></span></div><div class="rng"><div class="track"></div><div class="fill"></div><input type="range" aria-label="Est Revenue minimum"><input type="range" aria-label="Est Revenue maksimum"></div>`;
  host.appendChild(box);
  const [a,b]=box.querySelectorAll("input"),fill=box.querySelector(".fill");
  [a,b].forEach(r=>{r.min=min;r.max=max;r.step=1});a.value=min;b.value=max;
  function go(e){
    let x=+a.value,y=+b.value;
    if(x>y){if(e&&e.target===a){x=y;a.value=x}else{y=x;b.value=y}}
    st.lo=x;st.hi=y;const p=v=>(v-min)/(max-min)*100;
    fill.style.left=p(x)+"%";fill.style.width=(p(y)-p(x))+"%";
    a.style.zIndex=p(x)>50?3:1;
    box.querySelector(".lo").textContent=fmt(x);box.querySelector(".hi").textContent=fmt(y);cb();
  }
  a.oninput=b.oninput=go;go();
}

// ---- Dashboard 1: SALES PIPELINE ----
const s1={owners:new Set(D1.rows.map(r=>r[0])),lo:0,hi:0,hl:null},AX=80e9;
const all1=D1.rows.flatMap(r=>r[1]).filter(v=>v!=null),MIN1=Math.min(...all1),MAX1=Math.max(...all1);
$("cats1").innerHTML=D1.cats.map(c=>`<span>${c}</span>`).join("");
function draw1(){
  const rows=D1.rows.filter(r=>s1.owners.has(r[0]));
  if(!rows.length){$("rows1").innerHTML='<div class="empty">Tidak ada owner yang dipilih. Centang minimal satu owner di sebelah kanan.</div>';return}
  $("rows1").innerHTML=rows.map(([o,vals])=>{
    const cols=vals.map((v,i)=>{
      if(v==null||v<s1.lo||v>s1.hi)return '<div class="col"></div>';
      const h=v/AX*100,dim=s1.hl!==null&&s1.hl!==i;
      return `<div class="col" style="opacity:${dim?.22:1}"><div class="bar" style="height:${h}%;background:var(${COL[i]})" data-o="${o}" data-i="${i}" data-v="${v}"></div><div class="val" style="bottom:calc(${h}% + 3px)">${fmt(v)}</div></div>`}).join("");
    return `<div class="row"><div class="who">${o}</div><div class="yl">Est Revenue</div><div class="plot"><span class="tick" style="bottom:100%">80B</span><span class="tick" style="bottom:50%">40B</span><span class="tick" style="bottom:0">0B</span><div class="gl" style="bottom:100%"></div><div class="gl" style="bottom:50%"></div><div class="gl" style="bottom:0"></div><div class="bars">${cols}</div></div></div>`}).join("");
  $("rows1").querySelectorAll(".bar").forEach(b=>{
    showTip(b,`<b>${b.dataset.o}</b><br>${D1.cats[b.dataset.i]}<br>Est Revenue: ${fmt(+b.dataset.v)}`);
    b.onclick=()=>{s1.hl=s1.hl===+b.dataset.i?null:+b.dataset.i;legend1();draw1()};
  });
}
function legend1(){
  $("leg1").innerHTML=D1.cats.map((c,i)=>`<button class="lg ${s1.hl===i?"sel":""}" data-i="${i}" aria-pressed="${s1.hl===i}"><i style="background:var(${COL[i]})"></i>${c}</button>`).join("");
  $("leg1").querySelectorAll(".lg").forEach(b=>b.onclick=()=>{s1.hl=s1.hl===+b.dataset.i?null:+b.dataset.i;legend1();draw1()});
}
checklist($("side1"),"Owner",D1.rows.map(r=>r[0]),s1.owners,draw1,true);
range($("side1"),MIN1,MAX1,s1,draw1);
$("side1").insertAdjacentHTML("beforeend",'<div class="sec"><h3>Staging Category</h3><div id="leg1"></div></div>');
legend1();draw1();

// ---- Dashboard 2: DASHBOARD PT ----
const s2={parties:new Set(D2.rows.map(r=>r[0])),lo:0,hi:0},all2=D2.rows.flatMap(r=>r[1]).filter(v=>v!=null),MIN2=Math.min(...all2),MAX2=Math.max(...all2);
["c2a","c2b","c2c","c2d"].forEach((id,i)=>$(id).textContent=D2.cats[i]);
const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t)),C0=[211,229,244],C1=[42,91,140];
function draw2(){
  const rows=D2.rows.filter(r=>s2.parties.has(r[0]));
  if(!rows.length){$("rows2").innerHTML='<div class="empty">Tidak ada Sold To Party yang dipilih. Centang minimal satu di sebelah kanan.</div>';return}
  $("rows2").innerHTML=rows.map(([p,vals])=>`<div class="r2"><div class="who" title="${p}">${p}</div>`+vals.map((v,i)=>{
    if(v==null||v<s2.lo||v>s2.hi)return '<div class="cell"></div>';
    const t=v/MAX2,c=mix(C0,C1,t);
    return `<div class="cell"><div class="t">${fmt(v)}</div><div class="h" style="height:${2+8*t}px;background:rgb(${c})" data-p="${p}" data-i="${i}" data-v="${v}"></div></div>`}).join("")+"</div>").join("");
  $("rows2").querySelectorAll(".h").forEach(b=>showTip(b,`<b>${b.dataset.p}</b><br>${D2.cats[b.dataset.i]}<br>Est Revenue: ${fmt(+b.dataset.v)}`));
}
checklist($("side2"),"Sold To Party",D2.rows.map(r=>r[0]),s2.parties,draw2,false);
range($("side2"),Math.min(0,MIN2),MAX2,s2,draw2);
$("side2").insertAdjacentHTML("beforeend",`<div class="sec"><h3>Est Revenue</h3><div class="grad">${fmt(Math.min(0,MIN2))}<i></i>${Math.round(MAX2/1e9)}B</div></div>`);

// ---- tab ----
[["tab1","d1"],["tab2","d2"]].forEach(([t,d])=>$(t).onclick=()=>{
  ["tab1","tab2"].forEach(x=>$(x).setAttribute("aria-selected",x===t));
  $("d1").hidden=d!=="d1";$("d2").hidden=d!=="d2"});
</script>
</body>
</html>
